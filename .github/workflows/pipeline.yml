name: NFL data pipeline

on:
  schedule:
    - cron: "0 13 * * *"      # daily 13:00 UTC: stats, schedule, injuries, game odds
    - cron: "0 15 * * 0"      # Sun 15:00 UTC: also pull player props (~70 credits)
  workflow_dispatch:
    inputs:
      props:
        description: "Pull player props"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * 0" ] || [ "${{ inputs.props }}" = "true" ]; then
            python run.py --props
          else
            python run.py
          fi
      - name: Commit updated exports
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add exports/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
